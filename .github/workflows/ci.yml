name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Nons workspace
        uses: actions/checkout@v4
        with:
          repository: Miaoyww/Nons
          path: workspace
      - name: Checkout adapter
        uses: actions/checkout@v4
        with:
          path: workspace/adapters/qqmusic
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown
      - name: Install cargo-component
        run: cargo install cargo-component --version 0.21.1 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace/adapters/qqmusic -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workspace/packages/wasm-crypto/package-lock.json
      - name: Install Component test dependencies
        run: npm ci --prefix workspace/packages/wasm-crypto --include=dev
      - name: Run Rust tests
        run: cargo test --manifest-path workspace/adapters/qqmusic/Cargo.toml --locked
      - name: Build and test Component
        working-directory: workspace
        run: |
          node adapters/qqmusic/scripts/build.mjs
          node --test adapters/qqmusic/tests/component.test.mjs
      - name: Package release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p workspace/out
          test -f workspace/app/src-tauri/bundled-adapters/qqmusic/manifest.json
          test -f workspace/app/src-tauri/bundled-adapters/qqmusic/License
          (cd workspace/app/src-tauri/bundled-adapters/qqmusic && zip -qr "../../../../out/qqmusic-${GITHUB_REF_NAME}.zip" .)
          (cd workspace/out && sha256sum *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: nsa-qqmusic-release
          path: workspace/out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nsa-qqmusic-release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
          fi
